<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8">
<link href="../../site/v3/fonts/fonts.css" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #06070b; color: #f6f7f9; font-family: Inter, sans-serif; text-align: center; -webkit-font-smoothing: antialiased; }
  .blades { position: absolute; left: 50%; top: -96px; width: 1560px; height: 1560px; transform: translateX(-50%); }

  .edge { opacity: .85; }

    linear-gradient(180deg, rgba(6, 7, 11, 0) 42%, #06070b 80%),
    radial-gradient(120% 560px at 50% 0, rgba(6, 7, 11, 0) 50%, #06070b 100%); }

  .brand svg { width: 34px; height: 34px; }
  h1 { position: absolute; left: 60px; right: 60px; top: 98px; font: 400 100px/1.04 "Source Serif 4", Georgia, serif; font-optical-sizing: auto; letter-spacing: -.022em; text-wrap: balance; }
  h1 i { font-style: italic; }
  p { position: absolute; left: 170px; right: 170px; top: 334px; font-size: 29px; line-height: 1.42; letter-spacing: -.012em; color: #d0d6e0; text-wrap: balance; }
</style></head>
